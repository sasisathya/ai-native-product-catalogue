services:
  catalogue:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-native-product-catalogue:local
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4000}:${PORT:-4000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      CLIENT_DIST_DIR: /app/client/dist
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-1,2,3,4,5}
      FAKE_STORE_API_BASE_URL: ${FAKE_STORE_API_BASE_URL:-https://fakestoreapi.com}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-5000}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
